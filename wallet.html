<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>المحفظة - Syria Shop</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, sans-serif; -webkit-tap-highlight-color: transparent; }
        body { background-color: #080d1a; color: #f8fafc; padding-bottom: 85px; margin: 0; }

        .balance-top-header {
            background: linear-gradient(180deg, #1e3a8a 0%, #0f172a 100%);
            padding: 14px 16px; border-bottom-left-radius: 20px; border-bottom-right-radius: 20px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
            display: flex; justify-content: space-between; align-items: center;
        }
        .balance-text { font-size: 18px; font-weight: bold; color: #ffffff; direction: ltr; }
        .back-btn {
            background: rgba(255, 255, 255, 0.12); border: 1px solid #334155; color: #cbd5e1;
            padding: 6px 14px; border-radius: 8px; font-size: 12px; text-decoration: none; font-weight: bold;
        }

        .container { padding: 15px; }

        .wallet-card-pro {
            background: linear-gradient(135deg, #1e3a8a, #0f172a);
            border: 1px solid #2563eb; border-radius: 20px; padding: 22px 15px;
            text-align: center; margin-bottom: 15px; box-shadow: 0 6px 20px rgba(37, 99, 235, 0.25);
        }
        .wallet-card-pro h4 { font-size: 13px; color: #94a3b8; margin-bottom: 6px; }
        .wallet-card-pro .pro-balance { font-size: 26px; font-weight: bold; color: white; margin-bottom: 12px; font-family: monospace; }
        .btn-deposit-white {
            background: white; color: #1e3a8a; border: none; padding: 9px 24px;
            border-radius: 20px; font-size: 13px; font-weight: bold; cursor: pointer;
        }

        .deposit-box {
            background-color: #111827; border: 1.5px solid #2563eb; border-radius: 16px;
            padding: 15px; margin-bottom: 15px;
        }
        .number-row {
            background-color: #0b1120; border: 1px solid #334155; border-radius: 8px;
            padding: 8px 12px; display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px;
        }
        .copy-btn {
            background-color: #2563eb; color: white; border: none; padding: 6px 14px;
            border-radius: 6px; font-size: 12px; font-weight: bold; cursor: pointer;
        }
        .input-dark {
            background: #0b1120; border: 1px solid #334155; border-radius: 8px;
            padding: 10px 12px; width: 100%; color: white; font-size: 13px; outline: none; margin-bottom: 10px; text-align: right;
        }

        .section-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; margin-top: 10px; }
        .section-right { display: flex; align-items: center; gap: 8px; font-size: 14px; font-weight: bold; color: #f8fafc; }
        .section-tag { width: 4px; height: 14px; background-color: #38bdf8; border-radius: 2px; }

        .bottom-nav {
            position: fixed; bottom: 0; left: 0; right: 0; height: 62px;
            background: #070d1e; border-top: 1.5px solid #1e293b;
            display: flex; justify-content: space-around; align-items: center;
            z-index: 900; box-shadow: 0 -4px 15px rgba(0,0,0,0.6);
        }
        .nav-link-item {
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            gap: 2px; color: #64748b; font-size: 11px; font-weight: bold; cursor: pointer; flex: 1; height: 100%;
            text-decoration: none;
        }
        .nav-link-item.active { color: #38bdf8; }
        .nav-link-item .nav-icon { font-size: 20px; }
    </style>
</head>
<body>

    <header class="balance-top-header">
        <a href="index.html" class="back-btn">⬅ الرئيسية</a>
        <div class="balance-text" id="topWalletBalance">الرصيد: 0.00 ل.س</div>
    </header>

    <div class="container">
        <div class="wallet-card-pro">
            <h4>رصيد المحفظة الحالي</h4>
            <div class="pro-balance" id="subWalletBalance">0.00 ل.س</div>
            <button type="button" class="btn-deposit-white" onclick="toggleDeposit()">+ إيداع رصيد</button>
        </div>

        <div class="deposit-box" id="depositBox" style="display: none;">
            <div style="font-size:13px; color:#38bdf8; font-weight:bold; margin-bottom:8px;">إيداع رصيد عبر سيريتل كاش:</div>
            <div class="number-row">
                <span style="font-size:16px; font-weight:bold; color:#34d399; letter-spacing:1px;" id="syriatelNum">0990283201</span>
                <button type="button" class="copy-btn" onclick="copyNumber()">📋 نسخ الرقم</button>
            </div>
            <input type="text" id="transId" class="input-dark" placeholder="رقم العملية (من رسالة الكاش)">
            <input type="number" id="transAmount" class="input-dark" placeholder="المبلغ المحول (ل.س)">
            <button type="button" onclick="sendDepositProof()" style="background:#16a34a; color:white; border:none; width:100%; padding:11px; border-radius:8px; font-weight:bold; font-size:13px; cursor:pointer;">
                تأكيد إرسال الإشعار للدعم
            </button>
        </div>

        <div class="section-header">
            <div class="section-right"><div class="section-tag"></div><span>آخر المعاملات</span></div>
        </div>
        <div id="walletTransactionsList">
            <div style="text-align:center; color:#64748b; font-size:12px; padding:20px;">جارٍ تحميل المعاملات...</div>
        </div>
    </div>

    <footer class="bottom-nav">
        <a href="index.html" class="nav-link-item">
            <div class="nav-icon">🏠</div><div>الرئيسية</div>
        </a>
        <a href="wallet.html" class="nav-link-item active">
            <div class="nav-icon">👛</div><div>المحفظة</div>
        </a>
        <a href="orders.html" class="nav-link-item">
            <div class="nav-icon">📋</div><div>الطلبات</div>
        </a>
        <a href="events.html" class="nav-link-item">
            <div class="nav-icon">🎁</div><div>الفعاليات</div>
        </a>
    </footer>

    <script>
        var FIREBASE_URL = "https://syria-shop-01-default-rtdb.firebaseio.com";
        var ADMIN_EMAIL = "mouhnad mhmad@gmail.comm";
        var currentUser = "";

        try { currentUser = localStorage.getItem('syriaShopCurrentUser') || ""; } catch(e){}

        function toSafeKey(email) {
            return String(email || "guest").toLowerCase().replace(/[^a-z0-9]/g, '_');
        }

        function formatBalance(amount) {
            var num = parseFloat(amount) || 0;
            return num.toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
        }

        function toggleDeposit() {
            var b = document.getElementById('depositBox');
            b.style.display = (b.style.display === 'block') ? 'none' : 'block';
        }

        function copyNumber() {
            var num = "0990283201";
            navigator.clipboard.writeText(num).then(function() {
                alert("✅ تم نسخ الرقم: " + num);
            }).catch(function() {
                prompt("انسخ الرقم:", num);
            });
        }

        async function sendDepositProof() {
            var transId = document.getElementById('transId').value.trim();
            var amount = document.getElementById('transAmount').value.trim();
            if (!transId || !amount || Number(amount) <= 0) {
                alert("يرجى إدخال رقم العملية والمبلغ المحول!");
                return;
            }

            try {
                await fetch(FIREBASE_URL + "/deposit_requests.json", {
                    method: 'POST',
                    body: JSON.stringify({
                        userEmail: currentUser || "guest",
                        transId: transId,
                        amount: Number(amount),
                        status: 'قيد الانتظار',
                        method: 'Syriatel Cash',
                        time: new Date().toLocaleDateString('en-US')
                    })
                });
                alert("✅ تم إرسال إشعار التحويل للإدارة بنجاح!");
                document.getElementById('transId').value = '';
                document.getElementById('transAmount').value = '';
                toggleDeposit();
                loadTransactions();
            } catch (e) {
                alert("تعذر الاتصال بالسيرفر");
            }
        }

        function loadTransactions() {
            var container = document.getElementById('walletTransactionsList');
            if (!currentUser) {
                container.innerHTML = '<div style="text-align:center; color:#64748b; font-size:12px; padding:20px;">سجل دخولك لرؤية المعاملات</div>';
                return;
            }

            fetch(FIREBASE_URL + "/deposit_requests.json")
                .then(function(r){ return r.json(); })
                .then(function(data){
                    if (!data) {
                        container.innerHTML = '<div style="text-align:center; color:#64748b; font-size:12px; padding:20px;">لا توجد معاملات مسجلة بعد</div>';
                        return;
                    }
                    var list = [];
                    Object.keys(data).forEach(function(k){
                        if (data[k] && data[k].userEmail === currentUser) list.push(data[k]);
                    });
                    if (list.length === 0) {
                        container.innerHTML = '<div style="text-align:center; color:#64748b; font-size:12px; padding:20px;">لا توجد معاملات بعد</div>';
                        return;
                    }
                    container.innerHTML = '';
                    list.reverse().forEach(function(t){
                        var status = t.status || 'قيد الانتظار';
                        var statusColor = (status === 'مرفوض') ? '#f87171' : (status === 'موافق عليه' ? '#34d399' : '#fbbf24');
                        var div = document.createElement('div');
                        div.style.cssText = "background:#111827; border:1px solid #1f2937; border-radius:12px; padding:12px; margin-bottom:10px; display:flex; justify-content:space-between; align-items:center;";
                        div.innerHTML = `
                            <div>
                                <div style="font-size:12px; font-weight:bold; color:white;">💳 سيريتل كاش | رقم: ${t.transId}</div>
                                <div style="font-size:10px; color:#94a3b8;">${t.time || ''}</div>
                                <span style="border:1px solid ${statusColor}; color:${statusColor}; padding:2px 6px; border-radius:8px; font-size:9px; font-weight:bold;">${status}</span>
                                ${t.reason ? `<div style="font-size:10px; color:${statusColor}; margin-top:2px;">السبب: ${t.reason}</div>` : ''}
                            </div>
                            <div style="font-size:13px; font-weight:bold; color:#34d399; font-family:monospace;">+${formatBalance(t.amount)}</div>
                        `;
                        container.appendChild(div);
                    });
                }).catch(function(){
                    container.innerHTML = '<div style="text-align:center; color:#64748b; font-size:12px; padding:20px;">لا توجد معاملات بعد</div>';
                });
        }

        // جلب الرصيد
        (function(){
            if (!currentUser) return;
            if (currentUser === ADMIN_EMAIL) {
                document.getElementById('topWalletBalance').innerText = 'الرصيد: ∞';
                document.getElementById('subWalletBalance').innerText = '∞ (مدير النظام)';
                loadTransactions();
                return;
            }
            fetch(FIREBASE_URL + "/users/" + toSafeKey(currentUser) + ".json")
                .then(function(r){ return r.json(); })
                .then(function(u){
                    if (u && u.balance !== undefined) {
                        var b = formatBalance(u.balance);
                        document.getElementById('topWalletBalance').innerText = "الرصيد: " + b + " ل.س";
                        document.getElementById('subWalletBalance').innerText = b + " ل.س";
                    }
                }).catch(function(){});
            loadTransactions();
        })();
    </script>
</body>
</html>
