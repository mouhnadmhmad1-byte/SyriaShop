<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تسجيل الدخول - Syria Shop</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, sans-serif; }
        body { 
            background: linear-gradient(135deg, #0b0f19, #080d1a); 
            color: #f8fafc; display: flex; justify-content: center; align-items: center; 
            min-height: 100vh; padding: 20px; 
        }
        .login-card { 
            background-color: rgba(30, 41, 59, 0.95); backdrop-filter: blur(10px);
            border: 1px solid #334155; border-radius: 20px; padding: 30px 20px; width: 100%; max-width: 400px; 
            box-shadow: 0 15px 35px rgba(0,0,0,0.6);
        }
        .logo-area { text-align: center; margin-bottom: 25px; }
        .logo-area h1 { color: #38bdf8; font-size: 26px; margin-bottom: 6px; font-weight: bold; }
        .logo-area p { color: #94a3b8; font-size: 13px; }

        .tabs { display: flex; margin-bottom: 20px; background: #0f172a; border-radius: 10px; padding: 4px; border: 1px solid #334155; }
        .tab-btn { 
            flex: 1; padding: 10px; border: none; background: none; color: #94a3b8; 
            font-size: 14px; font-weight: bold; cursor: pointer; border-radius: 8px; transition: 0.3s;
        }
        .tab-btn.active { background-color: #2563eb; color: white; }

        .form-group { margin-bottom: 14px; }
        .form-group label { display: block; font-size: 12px; margin-bottom: 4px; color: #cbd5e1; }
        .form-group input { 
            width: 100%; padding: 12px; border-radius: 8px; border: 1px solid #334155; 
            background-color: #0f172a; color: white; font-size: 14px; outline: none; 
        }
        .form-group input:focus { border-color: #38bdf8; }

        .submit-btn { 
            background: linear-gradient(135deg, #2563eb, #1d4ed8); color: white; border: none; width: 100%; 
            padding: 13px; border-radius: 8px; font-size: 15px; font-weight: bold; margin-top: 10px; 
            cursor: pointer; transition: 0.2s;
        }
        .submit-btn:disabled { opacity: 0.6; cursor: not-allowed; }

        .error-msg { 
            color: #fca5a5; background-color: rgba(127,29,29,0.5); border: 1px solid #7f1d1d;
            padding: 10px; border-radius: 8px; font-size: 12px; text-align: center; margin-bottom: 15px; display: none; 
        }
    </style>
</head>
<body>

    <div class="login-card">
        <div class="logo-area">
            <h1>Syria Shop 🇸🇾</h1>
            <p id="subTitle">سجل دخولك بالبريد للمتابعة</p>
        </div>

        <div class="tabs">
            <button class="tab-btn active" id="loginTab" onclick="switchMode('login')">تسجيل دخول</button>
            <button class="tab-btn" id="registerTab" onclick="switchMode('register')">حساب جديد</button>
        </div>

        <div class="error-msg" id="errorMsg"></div>

        <div id="registerFields" style="display: none;">
            <div class="form-group">
                <label>الاسم الكامل:</label>
                <input type="text" id="userName" placeholder="مثال: أحمد المحمد">
            </div>
            <div class="form-group">
                <label>رقم الهاتف (سيريتل أو واتساب):</label>
                <input type="tel" id="userPhone" placeholder="09xxxxxxxx">
            </div>
        </div>

        <div class="form-group">
            <label>البريد الإلكتروني:</label>
            <input type="text" id="userEmail" placeholder="name@example.com">
        </div>

        <div class="form-group">
            <label>كلمة المرور:</label>
            <input type="password" id="userPass" placeholder="******">
        </div>

        <button class="submit-btn" id="submitBtn" onclick="handleSubmit()">دخول</button>
    </div>

    <script>
        const ADMIN_EMAIL = "mouhnad mhmad@gmail.comm";
        const ADMIN_PASS  = "159753";
        const FIREBASE_URL = "https://syria-shop-01-default-rtdb.firebaseio.com";

        let isRegisterMode = false;

        function switchMode(mode) {
            isRegisterMode = (mode === 'register');
            document.getElementById('errorMsg').style.display = 'none';

            if (isRegisterMode) {
                document.getElementById('registerTab').classList.add('active');
                document.getElementById('loginTab').classList.remove('active');
                document.getElementById('registerFields').style.display = 'block';
                document.getElementById('subTitle').innerText = 'أنشئ حساباً جديداً في المتجر';
                document.getElementById('submitBtn').innerText = 'إنشاء الحساب الآن';
            } else {
                document.getElementById('loginTab').classList.add('active');
                document.getElementById('registerTab').classList.remove('active');
                document.getElementById('registerFields').style.display = 'none';
                document.getElementById('subTitle').innerText = 'سجل دخولك بالبريد للمتابعة';
                document.getElementById('submitBtn').innerText = 'دخول';
            }
        }

        function showError(txt) {
            let err = document.getElementById('errorMsg');
            err.innerText = txt;
            err.style.display = 'block';
        }

        function toSafeKey(email) {
            return email.toLowerCase().replace(/[.#$\[\]@]/g, '_').trim();
        }

        async function handleSubmit() {
            let email = document.getElementById('userEmail').value.trim();
            let pass = document.getElementById('userPass').value.trim();
            let name = document.getElementById('userName').value.trim();
            let phone = document.getElementById('userPhone').value.trim();
            let btn = document.getElementById('submitBtn');

            if (!email || !pass) {
                showError("يرجى ملء البريد الإلكتروني وكلمة المرور");
                return;
            }

            // فحص دخول الأدمن
            if (email === ADMIN_EMAIL && pass === ADMIN_PASS) {
                localStorage.setItem('syriaShopCurrentUser', ADMIN_EMAIL);
                window.location.href = 'index.html';
                return;
            }

            btn.disabled = true;
            btn.innerText = "جارٍ التحقق...";

            let userKey = toSafeKey(email);

            try {
                if (isRegisterMode) {
                    if (!name || !phone) {
                        showError("يرجى ملء الاسم ورقم الهاتف بالكامل");
                        btn.disabled = false;
                        btn.innerText = "إنشاء الحساب الآن";
                        return;
                    }

                    // التحقق هل البريد مسجل مسبقاً
                    let checkRes = await fetch(`${FIREBASE_URL}/users/${userKey}.json`);
                    let existingUser = await checkRes.json();

                    if (existingUser) {
                        showError("هذا البريد مسجل مسبقاً، يرجى تسجيل الدخول");
                        btn.disabled = false;
                        btn.innerText = "إنشاء الحساب الآن";
                        return;
                    }

                    // تسجيل الحساب الجديد برصيد 0 ل.س
                    let newUser = {
                        name: name,
                        phone: phone,
                        email: email,
                        password: pass,
                        balance: 0
                    };

                    await fetch(`${FIREBASE_URL}/users/${userKey}.json`, {
                        method: 'PUT',
                        body: JSON.stringify(newUser)
                    });

                    localStorage.setItem('syriaShopCurrentUser', email);
                    window.location.href = 'index.html';

                } else {
                    let res = await fetch(`${FIREBASE_URL}/users/${userKey}.json`);
                    let user = await res.json();

                    if (!user) {
                        showError("هذا البريد غير مسجل! أنشئ حساباً جديداً أولاً");
                        btn.disabled = false;
                        btn.innerText = "دخول";
                        return;
                    }

                    if (user.password !== pass) {
                        showError("كلمة المرور غير صحيحة!");
                        btn.disabled = false;
                        btn.innerText = "دخول";
                        return;
                    }

                    localStorage.setItem('syriaShopCurrentUser', email);
                    window.location.href = 'index.html';
                }
            } catch (err) {
                showError("تعذر الاتصال بالخادم، تأكد من اتصال الإنترنت");
                btn.disabled = false;
                btn.innerText = isRegisterMode ? "إنشاء الحساب الآن" : "دخول";
            }
        }
    </script>
</body>
</html>
